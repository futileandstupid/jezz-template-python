[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-starter"
version = "0.1.0"
description = "JBC Edition 1.3 compliant Python starter with closed Pydantic schemas, Z3-provable contracts, and Hypothesis properties."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "icontract>=2.7.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_config = true
strict_markers = true

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
packages = ["ledger_starter", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.jezz.models]
default = "google:gemini-3.8-flash"
